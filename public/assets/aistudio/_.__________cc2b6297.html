<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>د. هشام عوض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e2a47;--muted:#4a6078;--blue:#1e5ba8;--deep:#0e3a6e;--mist:#eef4fa;--paper:#fff;--line:#d3e0ee;--red:#c8102e;--field:#fff;--wa:#1a7f4b;--onblue:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8f0f9;--muted:#9db3c9;--blue:#6aa6ec;--deep:#0a1b30;--mist:#13243a;--paper:#0b1828;--line:#26405e;--field:#0f2036;--wa:#2a9d62}}
:root[data-theme="dark"]{--ink:#e8f0f9;--muted:#9db3c9;--blue:#6aa6ec;--deep:#0a1b30;--mist:#13243a;--paper:#0b1828;--line:#26405e;--field:#0f2036;--wa:#2a9d62}
*{box-sizing:border-box}
html{scroll-behavior:smooth;height:100%}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:90px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.7 "Cairo",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;height:68px}
.brand{font-weight:800;font-size:19px;text-decoration:none;color:var(--blue)}
nav{display:flex;gap:22px;align-items:center}
nav a{text-decoration:none;font-weight:600;font-size:16px}
nav a:hover{color:var(--blue)}
.tools{display:flex;gap:10px;align-items:center}
.btn{display:inline-block;background:var(--blue);color:#fff;border:2px solid var(--blue);border-radius:999px;padding:11px 28px;font:600 17px "Cairo",sans-serif;text-decoration:none;cursor:pointer}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#06121f}
@media (prefers-color-scheme:light){.btn{color:#fff}}
.tools .btn{padding:6px 18px;font-size:15px}
.btn.alt{background:transparent;color:var(--blue)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.hero{background:var(--mist);padding:56px 0}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:44px;align-items:center}
.hero small{display:block;font-size:20px;color:var(--blue);font-weight:600}
h1{font-size:clamp(34px,5.4vw,56px);line-height:1.2;margin:4px 0 16px;font-weight:800}
.lead{color:var(--muted);max-width:32em;margin:0 0 26px}
.ph{width:100%;max-width:340px;justify-self:center;border-radius:50% 50% 24px 24px/38% 38% 24px 24px;border:6px solid var(--paper);box-shadow:0 0 0 3px var(--blue);display:block;aspect-ratio:3/4;object-fit:cover;object-position:top}
section{padding:60px 0}
h2{font-size:clamp(26px,4vw,36px);margin:0 0 10px;font-weight:800;line-height:1.3}
.sub{color:var(--muted);margin:0 0 28px;max-width:40em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.doc{display:grid;grid-template-columns:230px 1fr;gap:32px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:26px;background:var(--paper)}
.doc img{width:100%;border-radius:16px;display:block;aspect-ratio:3/4;object-fit:cover;object-position:top}
.doc h3{font-size:26px;margin:0}.doc .r{color:var(--blue);font-weight:600;margin:0 0 10px}
.doc ul{margin:0 0 18px;padding-inline-start:20px}
.alt-bg{background:var(--mist)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.card h3{margin:0 0 8px;font-size:20px;color:var(--blue)}
.card p{margin:0;color:var(--muted)}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.svc .card{text-align:center}
.ic{width:64px;height:64px;border-radius:50%;background:var(--mist);display:grid;place-items:center;margin:0 auto 12px}
.svc h3{color:var(--ink);font-size:18px}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
input,select,textarea{width:100%;font:400 17px "Cairo",sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink)}
.full{grid-column:1/-1}
.btns{display:flex;flex-wrap:wrap;gap:12px}
#msg{min-height:1.6em;font-weight:600;color:var(--red);margin:10px 0 0}
.note{color:var(--muted);font-size:14px;margin-top:6px}
.ft{background:var(--deep);color:#fff;padding:44px 0 30px}
.ft .cols{display:grid;grid-template-columns:repeat(2,1fr);gap:30px}
.ft h3{margin:0 0 6px;font-size:20px}
.ft p{margin:0 0 8px;color:#cfe0f3}
.ft a{color:#fff}
.ft .links{display:flex;gap:16px;flex-wrap:wrap}
.ft .cp{border-top:1px solid #ffffff33;margin-top:28px;padding-top:16px;color:#cfe0f3;font-size:14px}
@media (max-width:820px){nav{display:none}.hero .wrap,.two,.doc,.three,.svc,form,.ft .cols{grid-template-columns:1fr}.svc{grid-template-columns:1fr 1fr}.doc{text-align:center}.doc img{max-width:220px;margin:0 auto}.doc ul{text-align:start}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

var lang="ar";
try{var sv=localStorage.getItem("lang");if(sv==="ar"||sv==="en")lang=sv}catch(e){}
function pad(n){return (n<10?"0":"")+n}
function lab(h,m){var H=h%24,x=H%12;if(x===0)x=12;return x+":"+pad(m)+" "+(H>=12?T[lang].pm:T[lang].am)}
var $=function(id){return document.getElementById(id)};
var cs=$("c"),ts=$("t"),ds=$("d"),msg=$("msg");
var CROSS='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="color:var(--blue)" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
function fillTimes(keep){
 var c=CLINICS[cs.value],old=keep?ts.selectedIndex:0;ts.innerHTML="";
 for(var m=c.start*60;m<c.end*60;m+=SLOT_MIN){var s=lab(Math.floor(m/60),m%60);ts.add(new Option(s,s))}
 if(old>=0&&old<ts.options.length)ts.selectedIndex=old;
}
function render(){
 var t=T[lang];
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t[e.getAttribute("data-i")]});
 $("lang").textContent=t.btn;
 $("cred").innerHTML=t.cred.map(function(x){return "<li>"+x+"</li>"}).join("");
 $("why").innerHTML=t.why.map(function(x){return '<div class="card"><h3>'+x[0]+"</h3><p>"+x[1]+"</p></div>"}).join("");
 $("svc").innerHTML=t.svc.map(function(x){return '<div class="card"><div class="ic">'+CROSS+"</div><h3>"+x+"</h3></div>"}).join("");
 $("clinics").innerHTML=CLINICS.map(function(c){var a=c[lang==="ar"?"par":"pen"];
  return "<div><h3>"+c[lang]+"</h3><p>"+a+"</p><p>"+t.hours+lab(c.start,0)+" – "+lab(c.end,0)+"</p><div class=\"links\"><a href=\"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(c.par)+"\" target=\"_blank\" rel=\"noopener\">"+t.map+"</a>"+(PHONE_SHOWN?"<a dir=\"ltr\" href=\"tel:"+PHONE_SHOWN.replace(/\s/g,"")+"\">"+PHONE_SHOWN+"</a>":"")+"</div></div>"}).join("");
 var ci=cs.value||0;cs.innerHTML="";
 CLINICS.forEach(function(c,i){cs.add(new Option(c[lang]+" ("+lab(c.start,0)+" – "+lab(c.end,0)+")",i))});
 cs.value=ci;fillTimes(true);
 document.title=t.brand;msg.textContent="";
}
$("lang").addEventListener("click",function(){lang=lang==="en"?"ar":"en";try{localStorage.setItem("lang",lang)}catch(e){}render()});
cs.addEventListener("change",function(){fillTimes(false)});
var now=new Date();ds.min=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
render();
document.querySelectorAll("[data-ch]").forEach(function(b){b.addEventListener("click",function(){
 var t=T[lang];msg.style.color="var(--red)";msg.textContent="";
 var n=$("n").value.trim(),p=$("p").value.trim(),r=$("r").value.trim();
 if(!n||!p||!ds.value){msg.textContent=t.eFill;return}
 if(!/^\+?[0-9\s-]{8,}$/.test(p)){msg.textContent=t.ePhone;return}
 if(/X/.test(PHONE)){msg.textContent=t.eSetup;return}
 var c=CLINICS[cs.value],m=t.m;
 var text=m[0]+"\n"+m[1]+": "+n+"\n"+m[2]+": "+p+"\n"+m[3]+": "+c[lang]+"\n"+m[4]+": "+ds.value+"\n"+m[5]+": "+ts.value+(r?"\n"+m[6]+": "+r:"");
 var url=b.getAttribute("data-ch")==="wa"?"https://wa.me/"+PHONE+"?text="+encodeURIComponent(text):"sms:+"+PHONE+"?&body="+encodeURIComponent(text);
 var a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";
 document.body.appendChild(a);a.click();a.remove();
 msg.style.color="var(--blue)";msg.textContent=t.ok;
})});
</script>
